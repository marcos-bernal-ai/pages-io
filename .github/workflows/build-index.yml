name: Build project index

# Regenerates pages/index.json whenever something in pages/ changes on main
on:
  push:
    branches: [main]
    paths: ["pages/**", "scripts/build-index.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate pages/index.json
        run: ./scripts/build-index.sh

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- pages/index.json)" ]; then
            echo "pages/index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.json
          git commit -m "Update pages/index.json"
          git push
