<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --text: #1a1917;
      --muted: #75716b;
      --line: #e6e3dd;
      --accent: #c2410c;
      --shadow: 0 1px 2px rgba(26, 25, 23, .04), 0 8px 24px rgba(26, 25, 23, .06);
      --shadow-hover: 0 2px 4px rgba(26, 25, 23, .05), 0 20px 48px rgba(26, 25, 23, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #1b1a18;
        --text: #f2f0eb;
        --muted: #9c978f;
        --line: #2b2926;
        --accent: #fb923c;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3);
        --shadow-hover: 0 20px 48px rgba(0, 0, 0, .5);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1160px;
      margin-inline: auto;
      padding-inline: 24px;
    }

    /* ---------- Header ---------- */

    header { padding: 96px 0 56px; }

    .eyebrow {
      margin: 0 0 16px;
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 10px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3rem, 8vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    h1 em { color: var(--accent); }

    .intro {
      max-width: 520px;
      margin: 24px 0 0;
      font-size: 1.1rem;
      color: var(--muted);
    }

    /* ---------- Section bar ---------- */

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 16px 0;
      margin-bottom: 32px;
      border-top: 1px solid var(--line);
      font-size: .85rem;
      color: var(--muted);
    }

    /* ---------- Grid & cards ---------- */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 40px 32px;
    }

    .card {
      display: block;
      color: inherit;
      text-decoration: none;
      opacity: 0;
      animation: rise .6s ease forwards;
    }

    .thumb {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 12px;
      overflow: hidden;
      background: var(--line);
      box-shadow: var(--shadow);
      transition: box-shadow .3s ease, transform .3s ease;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .6s cubic-bezier(.2, .7, .2, 1);
    }
    /* Shown when a project has no .jpg */
    .thumb .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 4rem;
      color: var(--muted);
    }

    .card:hover .thumb, .card:focus-visible .thumb {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }
    .card:hover img { transform: scale(1.04); }
    .card:focus-visible { outline: none; }
    .card:focus-visible .thumb { outline: 2px solid var(--accent); outline-offset: 4px; }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 2px 0;
    }
    .meta h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .meta p {
      margin: 2px 0 0;
      font-size: .85rem;
      color: var(--muted);
    }
    .arrow {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      transition: background .3s ease, color .3s ease, border-color .3s ease, transform .3s ease;
    }
    .card:hover .arrow {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
      transform: rotate(-45deg);
    }

    /* ---------- Loading skeleton ---------- */

    .skeleton .thumb { animation: pulse 1.4s ease-in-out infinite; box-shadow: none; }
    .skeleton .line {
      height: 12px;
      margin-top: 18px;
      width: 40%;
      border-radius: 6px;
      background: var(--line);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .message { color: var(--muted); }

    /* ---------- Footer ---------- */

    footer {
      margin-top: 120px;
      padding-bottom: 48px;
      font-size: .85rem;
      color: var(--muted);
    }
    footer p {
      margin: 0;
      padding-top: 32px;
      border-top: 1px solid var(--line);
    }
    footer a { color: inherit; }

    /* ---------- Animations ---------- */

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      50% { opacity: .5; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .card { opacity: 1; }
    }
  </style>
</head>
<body>

  <header class="wrap">
    <p class="eyebrow">Portfolio</p>
    <h1>Selected <em>work</em></h1>
    <p class="intro">A collection of projects and experiments, each shown in its latest version.</p>
  </header>

  <main class="wrap">
    <div class="bar">
      <span>Projects</span>
      <span id="count"></span>
    </div>

    <div class="grid" id="grid">
      <!-- Skeleton cards, replaced once projects load -->
      <div class="card skeleton"><div class="thumb"></div><div class="line"></div></div>
      <div class="card skeleton"><div class="thumb"></div><div class="line"></div></div>
      <div class="card skeleton"><div class="thumb"></div><div class="line"></div></div>
    </div>
  </main>

  <footer class="wrap">
    <p>Hosted on GitHub Pages · <a href="#" id="repo-link">Source</a></p>
  </footer>

  <!-- Card template: cloned once per project -->
  <template id="card-template">
    <a class="card" href="#">
      <div class="thumb"><img src="" alt="" loading="lazy"></div>
      <div class="meta">
        <div>
          <h2></h2>
          <p></p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </div>
    </a>
  </template>

  <script>
    // Folder that holds the projects: pages/<project>/<project>_vXX.html (+ .jpg)
    const PAGES_DIR = "pages";

    // Repo used when the site is not served from <owner>.github.io/<repo>
    const FALLBACK_OWNER = "marcos-bernal-ai";
    const FALLBACK_REPO = "pages-io";

    function getRepo() {
      const host = location.hostname;
      if (host.endsWith(".github.io")) {
        const owner = host.replace(".github.io", "");
        const firstPath = location.pathname.split("/")[1];
        // Project site: owner.github.io/repo — User site: owner.github.io
        return { owner, repo: firstPath || host };
      }
      return { owner: FALLBACK_OWNER, repo: FALLBACK_REPO };
    }

    // Read every file path in the repo with one GitHub API call
    async function listFiles() {
      const { owner, repo } = getRepo();
      const url = `https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
      const data = await res.json();
      return data.tree.filter(item => item.type === "blob").map(item => item.path);
    }

    // Keep only the highest _vXX.html of each project folder
    function latestVersions(paths) {
      const pattern = new RegExp(`^${PAGES_DIR}/([^/]+)/(.+)_v(\\d+)\\.html$`, "i");
      const projects = {};

      for (const path of paths) {
        const match = path.match(pattern);
        if (!match) continue;
        const [, folder, , version] = match;
        const number = parseInt(version, 10);
        const current = projects[folder];
        if (!current) {
          projects[folder] = { folder, number, version, html: path, versions: 1 };
        } else {
          current.versions++;
          if (number > current.number) Object.assign(current, { number, version, html: path });
        }
      }

      const fileSet = new Set(paths);
      return Object.values(projects)
        .map(p => {
          const jpg = p.html.replace(/\.html$/i, ".jpg");
          return { ...p, image: fileSet.has(jpg) ? jpg : null };
        })
        .sort((a, b) => a.folder.localeCompare(b.folder));
    }

    // "my_project-name" -> "My Project Name"
    function prettyName(folder) {
      return folder
        .replace(/[_-]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function render(projects) {
      const grid = document.getElementById("grid");
      const template = document.getElementById("card-template");
      grid.innerHTML = "";

      projects.forEach((p, i) => {
        const card = template.content.cloneNode(true);
        const link = card.querySelector("a");
        const name = prettyName(p.folder);

        link.href = p.html;
        link.style.animationDelay = (i * 80) + "ms";
        card.querySelector("h2").textContent = name;
        card.querySelector("p").textContent =
          "v" + p.version + (p.versions > 1 ? " · " + p.versions + " versions" : "");

        const img = card.querySelector("img");
        if (p.image) {
          img.src = p.image;
          img.alt = name + " preview";
        } else {
          const placeholder = document.createElement("span");
          placeholder.className = "placeholder";
          placeholder.textContent = name.charAt(0);
          img.replaceWith(placeholder);
        }

        grid.appendChild(card);
      });

      document.getElementById("count").textContent =
        projects.length + (projects.length === 1 ? " project" : " projects");
    }

    function showMessage(text) {
      document.getElementById("grid").innerHTML = `<p class="message">${text}</p>`;
    }

    async function init() {
      const { owner, repo } = getRepo();
      document.getElementById("repo-link").href = `https://github.com/${owner}/${repo}`;

      try {
        const projects = latestVersions(await listFiles());
        if (projects.length === 0) {
          showMessage("No projects yet.");
          return;
        }
        render(projects);
      } catch (err) {
        showMessage("Could not load projects (" + err.message + ").");
      }
    }

    init();
  </script>
</body>
</html>
