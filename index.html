<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MB Portfolio</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <nav class="topbar wrap">
    <a class="logo" href="./" aria-label="MB Portfolio home">MB</a>
    <a class="topbar-link" href="https://github.com/marcos-bernal-ai">GitHub ↗</a>
  </nav>

  <header class="wrap">
    <p class="eyebrow">MB Portfolio</p>
    <h1>Selected <em>work</em></h1>
    <p class="intro">Here you'll find some of the projects I've been working on. Feel free to take a look.</p>
  </header>

  <main class="wrap">
    <div class="bar">
      <span>Projects</span>
      <span id="count"></span>
    </div>

    <div class="grid" id="grid">
      <!-- Skeleton cards, replaced once projects load -->
      <div class="card skeleton"><div class="thumb"></div><div class="line"></div></div>
      <div class="card skeleton"><div class="thumb"></div><div class="line"></div></div>
      <div class="card skeleton"><div class="thumb"></div><div class="line"></div></div>
    </div>
  </main>

  <footer class="wrap">
    <p>
      <span>
        Coded with <span class="heart" aria-label="love">♥</span>
        by <a href="https://github.com/marcos-bernal-ai">Marcos Bernal</a>
        and <a class="claude" href="https://claude.ai">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <path d="M12 12L12 1.5M12 12L15.8 5.5M12 12L21.1 6.8M12 12L19.5 12M12 12L21.1 17.2M12 12L15.8 18.5M12 12L12 22.5M12 12L8.3 18.5M12 12L2.9 17.2M12 12L4.5 12M12 12L2.9 6.7M12 12L8.2 5.5"/>
          </svg>Claude</a>
      </span>
      <span>© <span id="year">2026</span> MB Portfolio</span>
    </p>
  </footer>

  <!-- Card template: cloned once per project -->
  <template id="card-template">
    <a class="card" href="#">
      <div class="thumb"><img src="" alt="" loading="lazy"></div>
      <div class="meta">
        <div>
          <h2></h2>
          <p></p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </div>
    </a>
  </template>

  <script src="assets/js/portfolio.js"></script>
</body>
</html>
