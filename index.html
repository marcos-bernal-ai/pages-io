<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    :root {
      --bg: #fafaf9;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --accent: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --card: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --border: #292524;
        --accent: #818cf8;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header, main, footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header { padding-top: 72px; padding-bottom: 40px; }
    header h1 { margin: 0; font-size: 2.5rem; letter-spacing: -0.03em; }
    header p { margin: 8px 0 0; color: var(--muted); font-size: 1.1rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }

    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .12);
    }

    .card .thumb {
      aspect-ratio: 16 / 10;
      background: var(--border);
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }
    .card:hover img { transform: scale(1.04); }

    .card .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
    }
    .card h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .card .version {
      font-size: .8rem;
      color: var(--accent);
      border: 1px solid currentColor;
      border-radius: 999px;
      padding: 1px 10px;
    }

    .status { color: var(--muted); }

    footer { padding-top: 64px; padding-bottom: 40px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>

  <header>
    <h1>Portfolio</h1>
    <p>A collection of my projects.</p>
  </header>

  <main>
    <p class="status" id="status">Loading projects…</p>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    Hosted on GitHub Pages
  </footer>

  <!-- Card template: cloned once per project -->
  <template id="card-template">
    <a class="card" href="#">
      <div class="thumb"><img src="" alt="" loading="lazy"></div>
      <div class="info">
        <h2></h2>
        <span class="version"></span>
      </div>
    </a>
  </template>

  <script>
    // Folder that holds the projects: pages/<project>/<project>_vXX.html (+ .jpg)
    const PAGES_DIR = "pages";

    // Repo used when the site is not served from <owner>.github.io/<repo>
    const FALLBACK_OWNER = "marcos-bernal-ai";
    const FALLBACK_REPO = "pages-io";

    function getRepo() {
      const host = location.hostname;
      if (host.endsWith(".github.io")) {
        const owner = host.replace(".github.io", "");
        const firstPath = location.pathname.split("/")[1];
        // Project site: owner.github.io/repo — User site: owner.github.io
        return { owner, repo: firstPath || host };
      }
      return { owner: FALLBACK_OWNER, repo: FALLBACK_REPO };
    }

    // Read every file path in the repo with one GitHub API call
    async function listFiles() {
      const { owner, repo } = getRepo();
      const url = `https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
      const data = await res.json();
      return data.tree.filter(item => item.type === "blob").map(item => item.path);
    }

    // Keep only the highest _vXX.html of each project folder
    function latestVersions(paths) {
      const pattern = new RegExp(`^${PAGES_DIR}/([^/]+)/(.+)_v(\\d+)\\.html$`, "i");
      const projects = {};

      for (const path of paths) {
        const match = path.match(pattern);
        if (!match) continue;
        const [, folder, , version] = match;
        const number = parseInt(version, 10);
        if (!projects[folder] || number > projects[folder].number) {
          projects[folder] = { folder, number, version, html: path };
        }
      }

      const fileSet = new Set(paths);
      return Object.values(projects)
        .map(p => {
          const jpg = p.html.replace(/\.html$/i, ".jpg");
          return { ...p, image: fileSet.has(jpg) ? jpg : null };
        })
        .sort((a, b) => a.folder.localeCompare(b.folder));
    }

    // "my_project-name" -> "My Project Name"
    function prettyName(folder) {
      return folder
        .replace(/[_-]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function render(projects) {
      const grid = document.getElementById("grid");
      const template = document.getElementById("card-template");

      for (const p of projects) {
        const card = template.content.cloneNode(true);
        const name = prettyName(p.folder);

        card.querySelector("a").href = p.html;
        card.querySelector("h2").textContent = name;
        card.querySelector(".version").textContent = "v" + p.version;

        const img = card.querySelector("img");
        if (p.image) {
          img.src = p.image;
          img.alt = name + " preview";
        } else {
          img.remove();
        }

        grid.appendChild(card);
      }
    }

    async function init() {
      const status = document.getElementById("status");
      try {
        const projects = latestVersions(await listFiles());
        if (projects.length === 0) {
          status.textContent = "No projects yet.";
          return;
        }
        status.remove();
        render(projects);
      } catch (err) {
        status.textContent = "Could not load projects (" + err.message + ").";
      }
    }

    init();
  </script>
</body>
</html>
